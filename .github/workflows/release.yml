# 自动发布工作流：推送 v* 格式的 tag（如 v0.3.0）时，
# GitHub 会在云端 Windows 机器上自动打包并创建 Release、上传安装包。
name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 打包并创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '账痕 BillTrace ${{ github.ref_name }}'
          releaseBody: '请在下方 Assets 中下载安装包（setup.exe）或绿色单文件版（exe）。本软件 100% 本地存储，不上传任何数据。'
          releaseDraft: false
          prerelease: false

      - name: 上传绿色单文件版 exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(find "src-tauri/target/release" -maxdepth 1 -name "*.exe" -size +3M | head -1)
          cp "$exe" "BillTrace_${{ github.ref_name }}_x64.exe"
          gh release upload "${{ github.ref_name }}" "BillTrace_${{ github.ref_name }}_x64.exe" --clobber
        shell: bash

      # 中文 productName（账痕）在 tauri-action 上传的资产名里会被剥掉、只剩 "_0.4.0_x64-setup.exe"
      # 这种残缺名，统一改写成英文名 BillTrace_<tag>_x64-setup.exe
      - name: 规整安装包资产名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" -p "*-setup.exe" -D _setup --clobber || true
          old=$(ls _setup 2>/dev/null | grep -v '^BillTrace' | grep -- '-setup.exe' | head -1 || true)
          if [ -n "$old" ]; then
            mv "_setup/$old" "_setup/BillTrace_${{ github.ref_name }}_x64-setup.exe"
            gh release upload "${{ github.ref_name }}" "_setup/BillTrace_${{ github.ref_name }}_x64-setup.exe" --clobber
            gh release delete-asset "${{ github.ref_name }}" "$old" -y
          fi
        shell: bash
